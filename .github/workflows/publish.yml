name: publish

# Выпуск идёт от тега: сборка и отправка в PyPI без ручных шагов.
on:
  push:
    tags: ['v*']

jobs:
  build:
    name: Сборка
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      # Тег и версия в pyproject.toml должны совпадать: иначе в PyPI
      # уедет не та версия, а откатить её там нельзя.
      - name: Сверить версию с тегом
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$tag" != "$version" ]; then
            echo "тег $GITHUB_REF_NAME не совпадает с версией $version в pyproject.toml"
            exit 1
          fi

      - run: python -m unittest discover -s tests -t .

      - name: Собрать и проверить
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Публикация в PyPI
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/jsonseo

    # Доверенная публикация: PyPI проверяет, что сборка пришла именно из
    # этого репозитория и этого workflow. Токен не нужен и не хранится.
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@v1.14.2
